name: Publish container image

on:
  # No path filter: the validate job stays a reliable required check on every PR,
  # including compose-only ones.
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - 'index.html'
      - 'server.js'
      - 'assets/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/zenith-smoke.sh'
      - 'scripts/zenith-prepare-image-update.sh'
      - 'scripts/zenith-check-image.py'
      - '.github/workflows/publish-container.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build AMD64 image
        run: docker build --platform linux/amd64 -t zenith-smoke .

      - name: Boot and check app
        run: bash scripts/zenith-smoke.sh zenith-smoke

      - name: Validate Zenith Compose
        run: |
          if test -f zenith-compose.yml; then
            docker compose -f zenith-compose.yml config --quiet
            echo "zenith-compose.yml parses."
          else
            echo "No zenith-compose.yml yet; skipping."
          fi

  publish:
    name: Publish to GHCR
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long

      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify public image and prepare update
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/zenith-prepare-image-update.sh

      - uses: actions/upload-artifact@v7
        with:
          name: zenith-image-${{ github.sha }}
          path: zenith-image-update/
          if-no-files-found: error
